<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin - Digit Span Test</title>


  <!-- =====================================================
       STYLE
  ====================================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      min-height: 100vh;

      padding: 30px;

      color: #333;

    }


    .container {

      width: 100%;

      max-width: 1200px;

      margin: 0 auto;

      background: white;

      border-radius: 20px;

      padding: 30px;

      box-shadow:
        0 10px 30px
        rgba(
          0,
          0,
          0,
          0.2
        );

    }


    /* =====================================================
       LOGIN
    ====================================================== */

    .login-container {

      max-width: 420px;

      margin:
        60px auto;

      text-align: center;

    }


    .login-container h1 {

      margin-bottom: 10px;

    }


    .login-container p {

      color: #666;

    }


    input,
    select {

      width: 100%;

      padding: 13px;

      margin-top: 10px;

      border:
        1px solid #ccc;

      border-radius: 10px;

      font-size: 16px;

      outline: none;

    }


    input:focus,
    select:focus {

      border-color:
        #667eea;

    }


    button {

      border: none;

      border-radius: 10px;

      padding:
        12px 20px;

      font-size: 15px;

      cursor: pointer;

      color: white;

      background:
        #667eea;

      transition:
        0.2s;

    }


    button:hover {

      opacity: 0.9;

      transform:
        translateY(-1px);

    }


    .login-button {

      width: 100%;

      margin-top: 15px;

    }


    .logout-button {

      background:
        #e74c3c;

    }


    .refresh-button {

      background:
        #3498db;

    }


    .export-button {

      background:
        #28a745;

    }


    .message {

      margin-top: 15px;

      color: #e74c3c;

      font-weight: bold;

      min-height: 20px;

    }


    /* =====================================================
       GENERAL
    ====================================================== */

    .hidden {

      display: none !important;

    }


    .header {

      display: flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap: 15px;

      margin-bottom: 25px;

    }


    .header h1 {

      margin: 0;

    }


    .header-buttons {

      display: flex;

      gap: 10px;

    }


    /* =====================================================
       STATISTICS
    ====================================================== */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          1fr
        );

      gap: 20px;

      margin-bottom: 25px;

    }


    .stat-box {

      background:
        #f7f7f7;

      border-radius: 15px;

      padding: 20px;

      text-align: center;

    }


    .stat-title {

      color: #666;

      font-size: 14px;

    }


    .stat-value {

      font-size: 30px;

      font-weight: bold;

      margin-top: 8px;

      color:
        #667eea;

    }


    /* =====================================================
       FILTER
    ====================================================== */

    .filters {

      display: grid;

      grid-template-columns:
        1fr
        250px
        auto
        auto;

      gap: 10px;

      margin-bottom: 20px;

      align-items:
        end;

    }


    /* =====================================================
       TABLE
    ====================================================== */

    .table-container {

      width: 100%;

      overflow-x: auto;

    }


    table {

      width: 100%;

      border-collapse:
        collapse;

      min-width: 800px;

    }


    th,
    td {

      padding: 12px;

      border-bottom:
        1px solid #ddd;

      text-align: center;

    }


    th {

      background:
        #667eea;

      color: white;

      font-weight: bold;

    }


    tr:hover td {

      background:
        #f8f8ff;

    }


    .score {

      font-weight: bold;

    }


    .loading {

      text-align: center;

      padding: 30px;

      color: #666;

    }


    .empty {

      text-align: center;

      padding: 30px;

      color: #666;

    }


    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media (
      max-width: 800px
    ) {

      body {

        padding: 10px;

      }


      .container {

        padding: 20px;

      }


      .header {

        flex-direction:
          column;

        align-items:
          stretch;

      }


      .header-buttons {

        width: 100%;

      }


      .header-buttons button {

        flex: 1;

      }


      .stats {

        grid-template-columns:
          1fr;

      }


      .filters {

        grid-template-columns:
          1fr;

      }


      .filters button {

        width: 100%;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =====================================================
       LOGIN AREA
  ====================================================== -->

  <div
    id="loginArea"
    class="login-container"
  >

    <h1>
      Admin Digit Span Test
    </h1>

    <p>
      Silakan login untuk melihat hasil peserta.
    </p>


    <input
      type="email"
      id="email"
      placeholder="Email admin"
      autocomplete="email"
    >


    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button
      id="loginButton"
      class="login-button"
    >
      Login
    </button>


    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>


  <!-- =====================================================
       ADMIN AREA
  ====================================================== -->

  <div
    id="adminArea"
    class="hidden"
  >


    <!-- HEADER -->

    <div class="header">

      <h1>
        Hasil Digit Span Test
      </h1>


      <div class="header-buttons">

        <button
          id="refreshButton"
          class="refresh-button"
        >
          🔄 Refresh
        </button>


        <button
          id="logoutButton"
          class="logout-button"
        >
          Logout
        </button>

      </div>

    </div>


    <!-- =================================================
         STATISTICS
    ================================================== -->

    <div class="stats">


      <div class="stat-box">

        <div class="stat-title">
          Jumlah Peserta
        </div>

        <div
          id="totalStudents"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat-box">

        <div class="stat-title">
          Rata-rata Nilai
        </div>

        <div
          id="averageScore"
          class="stat-value"
        >
          0
        </div>

      </div>


      <div class="stat-box">

        <div class="stat-title">
          Nilai Tertinggi
        </div>

        <div
          id="highestScore"
          class="stat-value"
        >
          0
        </div>

      </div>


    </div>


    <!-- =================================================
         FILTER
    ================================================== -->

    <div class="filters">


      <input
        type="text"
        id="searchInput"
        placeholder="🔎 Cari nama..."
      >


      <select
        id="classFilter"
      >

        <option value="">
          Semua Kelas
        </option>

      </select>


      <button
        id="exportButton"
        class="export-button"
      >
        📥 Export Excel
      </button>


      <button
        id="clearFilterButton"
      >
        Reset
      </button>


    </div>


    <!-- =================================================
         TABLE
    ================================================== -->

    <div class="table-container">

      <table>

        <thead>

          <tr>

            <th>
              No
            </th>

            <th>
              Nama
            </th>

            <th>
              Kelas
            </th>

            <th>
              Forward
            </th>

            <th>
              Backward
            </th>

            <th>
              Total
            </th>

            <th>
              Tanggal / Waktu
            </th>

          </tr>

        </thead>


        <tbody
          id="tableBody"
        >

          <tr>

            <td
              colspan="7"
              class="loading"
            >
              Memuat data...
            </td>

          </tr>

        </tbody>

      </table>

    </div>


  </div>


</div>


<!-- =====================================================
     SHEETJS
====================================================== -->

<script
  src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js">
</script>


<!-- =====================================================
     FIREBASE
====================================================== -->

<script type="module">


  // =====================================================
  // IMPORT FIREBASE
  // =====================================================

  import {
    initializeApp
  }
  from
  "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


  import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy
  }
  from
  "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


  import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut
  }
  from
  "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


  // =====================================================
  // FIREBASE CONFIG
  // =====================================================

  const firebaseConfig = {

        apiKey: "AIzaSyDWPv1eHBJ8l3Z6g_Ti1cHZLHFY759UE6k",
        authDomain: "tes-digit-span.firebaseapp.com",
        projectId: "tes-digit-span",
        storageBucket: "tes-digit-span.firebasestorage.app",
        messagingSenderId: "815711240131",
        appId: "1:815711240131:web:c6df500eab0947c9a2c776",
        measurementId: "G-61D19S7Z5D"

  };


  // =====================================================
  // INITIALIZE
  // =====================================================

  const app =
    initializeApp(
      firebaseConfig
    );


  const db =
    getFirestore(
      app
    );


  const auth =
    getAuth(
      app
    );


  // =====================================================
  // ELEMENT
  // =====================================================

  const loginArea =
    document.getElementById(
      "loginArea"
    );


  const adminArea =
    document.getElementById(
      "adminArea"
    );


  const emailInput =
    document.getElementById(
      "email"
    );


  const passwordInput =
    document.getElementById(
      "password"
    );


  const loginButton =
    document.getElementById(
      "loginButton"
    );


  const loginMessage =
    document.getElementById(
      "loginMessage"
    );


  const logoutButton =
    document.getElementById(
      "logoutButton"
    );


  const refreshButton =
    document.getElementById(
      "refreshButton"
    );


  const exportButton =
    document.getElementById(
      "exportButton"
    );


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  const classFilter =
    document.getElementById(
      "classFilter"
    );


  const clearFilterButton =
    document.getElementById(
      "clearFilterButton"
    );


  const tableBody =
    document.getElementById(
      "tableBody"
    );


  const totalStudents =
    document.getElementById(
      "totalStudents"
    );


  const averageScore =
    document.getElementById(
      "averageScore"
    );


  const highestScore =
    document.getElementById(
      "highestScore"
    );


  // =====================================================
  // DATA
  // =====================================================

  let allResults = [];


  // =====================================================
  // LOGIN
  // =====================================================

  loginButton.addEventListener(
    "click",
    async () => {

      const email =
        emailInput
          .value
          .trim();


      const password =
        passwordInput
          .value;


      if (
        !email ||
        !password
      ) {

        loginMessage.innerText =
          "Email dan password harus diisi.";

        return;

      }


      loginMessage.innerText =
        "Sedang login...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        loginMessage.innerText =
          "";

      }
      catch(error) {

        console.error(
          error
        );


        loginMessage.innerText =
          getFirebaseErrorMessage(
            error
          );

      }

    }
  );


  // =====================================================
  // ENTER UNTUK LOGIN
  // =====================================================

  passwordInput.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter"
      ) {

        loginButton.click();

      }

    }
  );


  // =====================================================
  // LOGOUT
  // =====================================================

  logoutButton.addEventListener(
    "click",
    async () => {

      try {

        await signOut(
          auth
        );

      }
      catch(error) {

        console.error(
          error
        );

      }

    }
  );


  // =====================================================
  // AUTH STATE
  // =====================================================

  onAuthStateChanged(
    auth,
    async (user) => {

      if (user) {

        console.log(
          "Admin login:",
          user.email
        );


        loginArea
          .classList
          .add(
            "hidden"
          );


        adminArea
          .classList
          .remove(
            "hidden"
          );


        await loadResults();

      }
      else {

        loginArea
          .classList
          .remove(
            "hidden"
          );


        adminArea
          .classList
          .add(
            "hidden"
          );


        loginMessage.innerText =
          "";

      }

    }
  );


  // =====================================================
  // LOAD FIRESTORE
  // =====================================================

  async function loadResults() {

    tableBody.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="loading"
        >
          Memuat data dari Firebase...
        </td>

      </tr>

    `;


    try {

      const resultsQuery =
        query(
          collection(
            db,
            "testResults"
          ),
          orderBy(
            "createdAt",
            "desc"
          )
        );


      const snapshot =
        await getDocs(
          resultsQuery
        );


      allResults = [];


      snapshot.forEach(
        (documentSnapshot) => {

          const data =
            documentSnapshot.data();


          allResults.push({

            id:
              documentSnapshot.id,

            name:
              data.name || "",

            className:
              data.className || "",

            forwardScore:
              convertNumber(
                data.forwardScore
              ),

            backwardScore:
              convertNumber(
                data.backwardScore
              ),

            totalScore:
              convertNumber(
                data.totalScore
              ),

            createdAt:
              data.createdAt || null

          });

        }
      );


      console.log(
        "Data berhasil:",
        allResults
      );


      buildClassFilter();


      displayResults(
        allResults
      );

    }
    catch(error) {

      console.error(
        "Firestore error:",
        error
      );


      tableBody.innerHTML = `

        <tr>

          <td
            colspan="7"
            class="empty"
          >

            <strong>
              Gagal mengambil data.
            </strong>

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </td>

        </tr>

      `;

    }

  }


  // =====================================================
  // DISPLAY DATA
  // =====================================================

  function displayResults(
    results
  ) {

    tableBody.innerHTML =
      "";


    if (
      results.length === 0
    ) {

      tableBody.innerHTML = `

        <tr>

          <td
            colspan="7"
            class="empty"
          >
            Tidak ada data.
          </td>

        </tr>

      `;


      updateStatistics(
        []
      );


      return;

    }


    results.forEach(
      (data, index) => {

        const row =
          document.createElement(
            "tr"
          );


        const dateText =
          formatDate(
            data.createdAt
          );


        row.innerHTML = `

          <td>
            ${index + 1}
          </td>

          <td>
            ${escapeHtml(
              data.name
            )}
          </td>

          <td>
            ${escapeHtml(
              data.className
            )}
          </td>

          <td>
            ${data.forwardScore}
          </td>

          <td>
            ${data.backwardScore}
          </td>

          <td class="score">
            ${data.totalScore}
          </td>

          <td>
            ${dateText}
          </td>

        `;


        tableBody.appendChild(
          row
        );

      }
    );


    updateStatistics(
      results
    );

  }


  // =====================================================
  // STATISTICS
  // =====================================================

  function updateStatistics(
    results
  ) {

    totalStudents.innerText =
      results.length;


    if (
      results.length === 0
    ) {

      averageScore.innerText =
        "0";

      highestScore.innerText =
        "0";

      return;

    }


    let total =
      0;


    let highest =
      0;


    results.forEach(
      (data) => {

        total +=
          data.totalScore;


        if (
          data.totalScore >
          highest
        ) {

          highest =
            data.totalScore;

        }

      }
    );


    const average =
      total /
      results.length;


    averageScore.innerText =
      average.toFixed(
        2
      );


    highestScore.innerText =
      highest;

  }


  // =====================================================
  // BUILD CLASS FILTER
  // =====================================================

  function buildClassFilter() {

    classFilter.innerHTML = `

      <option value="">
        Semua Kelas
      </option>

    `;


    const classSet =
      new Set();


    allResults.forEach(
      (data) => {

        if (
          data.className
        ) {

          classSet.add(
            data.className
          );

        }

      }
    );


    const classes =
      Array.from(
        classSet
      );


    classes.sort(
      (a, b) =>
        a.localeCompare(
          b,
          "id"
        )
    );


    classes.forEach(
      (className) => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          className;


        option.innerText =
          className;


        classFilter.appendChild(
          option
        );

      }
    );

  }


  // =====================================================
  // FILTER DATA
  // =====================================================

  function getFilteredResults() {

    const keyword =
      searchInput
        .value
        .toLowerCase()
        .trim();


    const selectedClass =
      classFilter.value;


    return allResults.filter(
      (data) => {

        const nameMatch =
          data.name
            .toLowerCase()
            .includes(
              keyword
            );


        const classMatch =
          selectedClass === ""
          ||
          data.className ===
          selectedClass;


        return (
          nameMatch &&
          classMatch
        );

      }
    );

  }


  // =====================================================
  // SEARCH
  // =====================================================

  searchInput.addEventListener(
    "input",
    () => {

      const filtered =
        getFilteredResults();


      displayResults(
        filtered
      );

    }
  );


  // =====================================================
  // CLASS FILTER
  // =====================================================

  classFilter.addEventListener(
    "change",
    () => {

      const filtered =
        getFilteredResults();


      displayResults(
        filtered
      );

    }
  );


  // =====================================================
  // RESET FILTER
  // =====================================================

  clearFilterButton.addEventListener(
    "click",
    () => {

      searchInput.value =
        "";

      classFilter.value =
        "";


      displayResults(
        allResults
      );

    }
  );


  // =====================================================
  // REFRESH
  // =====================================================

  refreshButton.addEventListener(
    "click",
    async () => {

      await loadResults();

    }
  );


  // =====================================================
  // EXPORT EXCEL
  // =====================================================

  exportButton.addEventListener(
    "click",
    () => {

      const filtered =
        getFilteredResults();


      if (
        filtered.length === 0
      ) {

        alert(
          "Tidak ada data yang dapat diekspor."
        );

        return;

      }


      const excelData =
        filtered.map(
          (data, index) => {

            return {

              "No":
                index + 1,

              "Nama":
                data.name,

              "Kelas":
                data.className,

              "Forward Score":
                data.forwardScore,

              "Backward Score":
                data.backwardScore,

              "Total Score":
                data.totalScore,

              "Tanggal / Waktu":
                formatDatePlain(
                  data.createdAt
                )

            };

          }
        );


      // Buat worksheet

      const worksheet =
        XLSX.utils.json_to_sheet(
          excelData
        );


      // Lebar kolom

      worksheet["!cols"] = [

        {
          wch: 6
        },

        {
          wch: 25
        },

        {
          wch: 18
        },

        {
          wch: 16
        },

        {
          wch: 18
        },

        {
          wch: 15
        },

        {
          wch: 25
        }

      ];


      // Buat workbook

      const workbook =
        XLSX.utils.book_new();


      XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Hasil Test"
      );


      // Nama file

      const today =
        new Date();


      const year =
        today.getFullYear();


      const month =
        String(
          today.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const day =
        String(
          today.getDate()
        ).padStart(
          2,
          "0"
        );


      const filename =
        `Hasil-Digit-Span-${year}-${month}-${day}.xlsx`;


      // Download

      XLSX.writeFile(
        workbook,
        filename
      );

    }
  );


  // =====================================================
  // FORMAT FIRESTORE TIMESTAMP
  // =====================================================

  function formatDate(
    timestamp
  ) {

    if (
      !timestamp
    ) {

      return "-";

    }


    try {

      const date =
        timestamp.toDate();


      return date.toLocaleString(
        "id-ID",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }
    catch(error) {

      return "-";

    }

  }


  // =====================================================
  // FORMAT DATE UNTUK EXCEL
  // =====================================================

  function formatDatePlain(
    timestamp
  ) {

    if (
      !timestamp
    ) {

      return "";

    }


    try {

      const date =
        timestamp.toDate();


      return date.toLocaleString(
        "id-ID"
      );

    }
    catch(error) {

      return "";

    }

  }


  // =====================================================
  // CONVERT NUMBER
  // =====================================================

  function convertNumber(
    value
  ) {

    const number =
      Number(
        value
      );


    if (
      Number.isNaN(
        number
      )
    ) {

      return 0;

    }


    return number;

  }


  // =====================================================
  // ESCAPE HTML
  // =====================================================

  function escapeHtml(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      String(
        text
      );


    return div.innerHTML;

  }


  // =====================================================
  // FIREBASE ERROR
  // =====================================================

  function getFirebaseErrorMessage(
    error
  ) {

    if (
      error.code ===
      "auth/invalid-credential"
    ) {

      return
        "Email atau password salah.";

    }


    if (
      error.code ===
      "auth/invalid-email"
    ) {

      return
        "Format email tidak valid.";

    }


    if (
      error.code ===
      "auth/user-not-found"
    ) {

      return
        "Akun admin tidak ditemukan.";

    }


    if (
      error.code ===
      "auth/wrong-password"
    ) {

      return
        "Password salah.";

    }


    if (
      error.code ===
      "auth/too-many-requests"
    ) {

      return
        "Terlalu banyak percobaan login. Coba lagi nanti.";

    }


    return
      error.message ||
      "Login gagal.";

  }


</script>
